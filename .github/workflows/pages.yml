name: GitHub Pages

# Publie deux sites sur la même Page :
#   - la racine (/)     : la branche main
#   - /ai/              : la branche feat/ai-illustrations (aperçu, storage_prefix distinct)
# Déclenché par un push sur main ou manuellement (Run workflow). Un push sur la
# branche d'aperçu ne redéclenche pas le déploiement : relancer le workflow à la main.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      slovingo_ref:
        description: "Branche/tag/commit du moteur Slovingo à utiliser"
        required: false
        default: "main"
      preview_ref:
        description: "Branche d'aperçu publiée sous /ai/"
        required: false
        default: "feat/ai-illustrations"

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout contenu (main)
        uses: actions/checkout@v5
        with:
          path: content

      - name: Checkout contenu (aperçu)
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.preview_ref || 'feat/ai-illustrations' }}
          path: content-ai

      - name: Checkout moteur (Slovingo)
        uses: actions/checkout@v5
        with:
          repository: lstux/Slovingo
          ref: ${{ inputs.slovingo_ref || 'main' }}
          path: engine

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Dépendances (Pillow, pour les icônes)
        run: python3 -m pip install -r engine/requirements.txt

      - name: Placer les deux contenus au format attendu par build.py
        run: |
          mkdir -p engine/langs/de-fr-kids engine/langs/de-fr-kids-ai
          tar --exclude=.git --exclude=.github --exclude=LICENSE --exclude='README*' \
            -cf - -C content . | tar -xf - -C engine/langs/de-fr-kids
          tar --exclude=.git --exclude=.github --exclude=LICENSE --exclude='README*' \
            -cf - -C content-ai . | tar -xf - -C engine/langs/de-fr-kids-ai

      - name: Adapter url_path et storage_prefix (sans toucher aux repos)
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          repo = os.environ["GITHUB_REPOSITORY"].split("/", 1)[1]
          for d, path, suffix in [("engine/langs/de-fr-kids", f"/{repo}/", ""),
                                  ("engine/langs/de-fr-kids-ai", f"/{repo}/ai/", "-ai")]:
              p = pathlib.Path(d) / "lang.json"
              cfg = json.loads(p.read_text(encoding="utf-8"))
              cfg["site"]["url_path"] = path
              if suffix:
                  cfg["site"]["storage_prefix"] = cfg["site"]["storage_prefix"] + suffix
              p.write_text(json.dumps(cfg, ensure_ascii=False, indent=2), encoding="utf-8")
              print(d, "url_path =", path)
          PY

      - name: Build (main et aperçu)
        run: |
          cd engine
          python3 src/build.py --lang-dir langs/de-fr-kids --static-dir static
          python3 src/build.py --lang-dir langs/de-fr-kids-ai --static-dir static

      - uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Préparer l'artefact Pages
        run: |
          mkdir -p _site/ai
          cp -r engine/langs/de-fr-kids/dist/. _site/
          cp -r engine/langs/de-fr-kids-ai/dist/. _site/ai/
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
